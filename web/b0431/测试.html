<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>

<body>
<div id="pieChart" style="width:100%;height:360px;"></div>

<script>
const pieChart = echarts.init(document.getElementById("pieChart"))

const data = [
  { name: "小说", value: 40 },
  { name: "漫画", value: 25 },
  { name: "游戏", value: 20 },
  { name: "影视", value: 15 }
]

const option = {
  tooltip: {
    trigger: 'item',
    formatter: '{b}: {c} ({d}%)'
  },

  legend: {
    bottom: 10,
    textStyle: { color: '#6b7280', fontSize: 12 },
    itemGap: 20
  },

  series: [
    {
      name: '分类占比',
      type: 'pie',
      radius: ['40%', '70%'], // 内外半径形成环形
      avoidLabelOverlap: false,
      itemStyle: {
        borderRadius: 6,
        borderColor: '#fff',
        borderWidth: 2
      },
      label: {
        show: true,
        position: 'outside',
        color: '#374151',
        fontSize: 12
      },
      labelLine: {
        lineStyle: { color: '#d1d5db' },
        length: 15,
        length2: 10
      },
      data: data
    }
  ]
}

pieChart.setOption(option)
window.addEventListener("resize", () => pieChart.resize())
</script>
</body>
</html>
