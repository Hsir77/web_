<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      const urls = [];
      for (let i = 1; i <= 100; i++) {
        urls.push(`https://jsonplaceholder.typicode.com/todos/${i}`);
      }

      concurRequest(urls, 3).then((resps) => {
        console.log(resps);
      });

      function concurRequest(urls, maxnum) {
        return new Promise((resolve, reject) => {
          if (urls.length == 0) {
            resolve([]);
            return;
          }
          const results = [];
          let index = 0;
          let count = 0;
          async function fetcher(retryCount = 3) {
            if (index >= urls.length) {
              return;
            }
            let i = index;
            index++;
            try {
              const res = await fetch(urls[i]);
              results[i] = res;
            } catch (error) {
              if (retryCount > 0) {
                fetcher();
                retryCount--;
                return;
              } else {
                results[i] = error;
              }
            } finally {
              console.log(urls[i]);
              count++;
              if (count == urls.length) {
                resolve(results);
                return;
              }
              fetcher();
            }
          }

          const times = Math.min(maxnum, urls.length);
          for (let h = 0; h < times; h++) {
            fetcher();
          }
        });
      }

      
    </script>
  </body>
</html>
