<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      class ListNode {
        constructor(val) {
          this.val = val;
          this.next = null;
        }
      }
      class ArrayListNode {
        constructor() {
          this.dummy = new ListNode(-999);
        }

        link(arr) {
          let p = this.dummy;
          for (let a of arr) {
            const node = new ListNode(a);
            p.next = node;
            p = node;
          }
        }
        getHead() {
          return this.dummy.next;
        }
      }

      function findcircle1(p) {
        const set1 = new Set();
        while (p !== null) {
          if (set1.has(p)) {
            return p;
          } else {
            set1.add(p);
            p = p.next;
          }
        }
        return null;
      }

      function findcircle2(p) {
        if (p === null && p.next === null) return null;
        let slow = p;
        let fast = p;
        let isCircle = false;

        while (fast !== null || fast.next != null) {
          slow = slow.next;
          fast = fast.next.next;
          if (fast === slow) {
            isCircle = true;
            break;
          }
        }
        if (!isCircle) return null;
        slow = p;
        while (slow !== fast) {
          slow = slow.next;
          fast = fast.next;
        }

        return slow;
      }

      let list = new ArrayListNode();
      list.link([1, 2, 3, 4, 5, 6]);
      let head = list.getHead();

      let node3 = head.next.next;
      let tail = head;
      while (tail.next !== null) {
        tail = tail.next;
      }
      tail.next = node3;

      findcircle1(head);
      console.log("findcircle", findcircle1(head));
      console.log("findcircle", findcircle2(head));
    </script>
  </body>
</html>
